<title>Poczta – czytnik</title>
<style>
:root{--bg:#fff;--surf:#f1f3f4;--txt:#202124;--mut:#5f6368;--line:#e8eaed;--blue:#1a73e8;--sel:#e8f0fe;--star:#f4b400;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1f1f;--surf:#2d2e30;--txt:#e8eaed;--mut:#9aa0a6;--line:#3c4043;--blue:#8ab4f8;--sel:#1f3a5f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1f1f;--surf:#2d2e30;--txt:#e8eaed;--mut:#9aa0a6;--line:#3c4043;--blue:#8ab4f8;--sel:#1f3a5f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 12px}
.search{display:flex;align-items:center;gap:2px;background:var(--surf);border-radius:28px;height:50px;padding:0 6px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:inherit;outline:0;padding:0 6px}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mut);flex:none}
.ic:active{background:rgba(128,128,128,.2)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub{display:flex;align-items:center;justify-content:space-between;padding:4px 16px}
.sub h2{font-size:13px;color:var(--mut);margin:0;font-weight:600}
.pill{border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:13px}
.pill.on{background:var(--sel);color:var(--blue);border-color:transparent}
.row{display:flex;gap:12px;width:100%;text-align:left;padding:10px 16px;min-height:76px}
.row:active{background:var(--surf)}
.av{flex:none;width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:600}
.ln{flex:1;min-width:0}
.l1{display:flex;justify-content:space-between;gap:8px}
.l1 time{font-size:12px;color:var(--mut);flex:none}
.l2,.l3 .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l3{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
.l3 .sn{flex:1;min-width:0}
.unread .nm,.unread .l2,.unread time{font-weight:700;color:var(--txt)}
.chip{font-size:11px;background:var(--surf);border-radius:4px;padding:1px 6px;color:var(--mut);flex:none}
.star{width:18px;height:18px;flex:none;fill:none;stroke:#9aa0a6;stroke-width:2}
.star.on{fill:var(--star);stroke:var(--star)}
.state{text-align:center;color:var(--mut);padding:56px 24px;display:grid;gap:12px;justify-items:center}
.demo{text-align:center;color:var(--mut);font-size:12px;padding:16px}
.sk .av{background:var(--surf)}
.sk i{display:block;height:11px;border-radius:6px;background:var(--surf);margin:7px 0;animation:p 1.1s infinite alternate}
.sk i:nth-child(2){width:70%}.sk i:nth-child(3){width:90%}
@keyframes p{to{opacity:.4}}
.spin svg{animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer{width:82%;max-width:320px;height:100%;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;animation:s .2s ease}
@keyframes s{from{transform:translateX(-100%)}}
.drawer h1{font-size:22px;color:var(--blue);margin:8px 12px 0}
.nav{display:flex;align-items:center;gap:16px;width:100%;height:48px;padding:0 16px 0 28px;margin-left:-12px;border-radius:0 24px 24px 0;text-align:left}
.nav.on{background:var(--sel);color:var(--blue);font-weight:600}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.mut{color:var(--mut)}.sm{font-size:12px;margin:4px 12px}
.msg{padding:4px 16px 32px;animation:f .18s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.msg h1{font-size:21px;line-height:1.3;margin:8px 0}
.from{display:flex;gap:12px;align-items:flex-start;margin:14px 0;padding-bottom:14px;border-bottom:1px solid var(--line)}
.from .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
.body{overflow-wrap:anywhere;word-break:break-word;font-size:15.5px}
.body *{max-width:100%}.body a{color:var(--blue)}
.body table{display:block;overflow-x:auto;border-collapse:collapse}.body td,.body th{padding:4px 12px 4px 0}
.body blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--line);color:var(--mut)}
.att{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.att .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ext{background:#fce8e6;color:#c5221f;font-size:11px;font-weight:700;padding:3px 6px;border-radius:4px}
</style>

function sanitize(html){const doc=new DOMParser().parseFromString(html,"text/html");
 const walk=root=>{for(const el of Array.from(root.children)){const t=el.tagName.toLowerCase();
  if(DROP.has(t)){el.remove();continue}
  if(!ALLOW.has(t)){walk(el);el.replaceWith(...Array.from(el.childNodes));continue}
  for(const a of Array.from(el.attributes))if(!(t==="a"&&a.name==="href"))el.removeAttribute(a.name);
  if(t==="a"){const h=el.getAttribute("href")||"";if(/^(https?:|mailto:|tel:)/i.test(h)){el.setAttribute("target","_blank");el.setAttribute("rel","noopener noreferrer nofollow")}else el.removeAttribute("href")}

 (m.a.length?'<h3 style="margin:24px 0 8px;font-size:14px">Załączniki ('+m.a.length+')</h3>'+m.a.map(a=>'<div class="att"><span class="ext">'+esc(a[2])+'</span><span class="n">'+esc(a[0])+'</span><span class="mut">'+esc(a[1])+'</span></div>').join("")+'<p class="mut sm">Podgląd załączników wymaga prawdziwego źródła danych.</p>':"")+'</article>'}
function viewList(){
 const label=FOLDERS.find(f=>f[0]===P.folder)[1],list=visible();let rows="";
 if(loading)rows=Array.from({length:6},()=>'<div class="row sk"><div class="av"></div><div class="ln"><i></i><i></i><i></i></div></div>').join("");
 else if(!list.length)rows='<div class="state">'+svg(IC.inbox).replace("<svg",'<svg width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5"')+'<p>'+(q?"Brak wyników dla „"+esc(q)+"”":P.unreadOnly?"Brak nieprzeczytanych wiadomości":"Ta skrzynka jest pusta")+'</p></div>';
 else rows=list.map(m=>'<button class="row'+(unread(m)?" unread":"")+'" data-id="'+m.id+'">'+av(m.n)+'<div class="ln"><div class="l1"><span class="nm">'+esc(m.n)+'</span><time>'+fmt(m.d)+'</time></div><div class="l2">'+esc(m.s)+'</div><div class="l3"><span class="sn">'+esc(m.sn)+'</span>'+(m.a.length?'<svg class="star" viewBox="0 0 24 24" style="stroke:var(--mut)"><path d="'+IC.clip+'"/></svg>':"")+m.l.map(l=>'<span class="chip">'+esc(l)+'</span>').join("")+'<svg class="star'+(m.st?" on":"")+'" viewBox="0 0 24 24"><path d="'+STAR+'"/></svg></div></div></button>').join("");
 return '<div class="bar"><div class="search"><button class="ic" data-a="menu" aria-label="Menu">'+svg(IC.menu)+'</button><input id="q" type="search" placeholder="Szukaj w: '+esc(label)+'" aria-label="Szukaj wiadomości" value="'+esc(q)+'" autocomplete="off">'+(q?'<button class="ic" data-a="clear" aria-label="Wyczyść">'+svg(IC.x)+'</button>':"")+'<button class="ic'+(spin?" spin":"")+'" data-a="refresh" aria-label="Odśwież">'+svg(IC.ref)+'</button></div></div>'+
 '<div class="sub"><h2>'+label+'</h2><button class="pill'+(P.unreadOnly?" on":"")+'" data-a="unread" aria-pressed="'+P.unreadOnly+'">Nieprzeczytane</button></div><main>'+rows+'<p class="demo">Dane demonstracyjne – to nie jest prawdziwe konto pocztowe. Tryb tylko do odczytu.</p></main>'+
 (drawer?'<div class="scrim" data-a="close"><nav class="drawer" aria-label="Foldery"><h1>Poczta</h1><p class="mut sm">Tryb tylko do odczytu</p>'+FOLDERS.map(f=>'<button class="nav'+(P.folder===f[0]?" on":"")+'" data-f="'+f[0]+'">'+svg(f[2])+f[1]+'</button>').join("")+'</nav></div>':"")}
function render(){
 const focus=document.activeElement&&document.activeElement.id==="q",pos=focus?document.activeElement.selectionStart:0;
 const m=openId&&MAILS.find(x=>x.id===openId);
 $("#app").innerHTML=m?viewMail(m):viewList();
 if(focus){const i=$("#q");if(i){i.focus();i.setSelectionRange(pos,pos)}}}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-a],[data-id],[data-f]");if(!t)return;
 if(t.dataset.f){P.folder=t.dataset.f;drawer=false;q="";save();fetchSim();return}
 if(t.dataset.id){const id=+t.dataset.id;if(!P.read.includes(id)){P.read.push(id);save()}openId=id;scrollTo(0,0);render();return}
 const a=t.dataset.a;
 if(a==="close"){if(e.target===t){drawer=false;render()}}
 else if(a==="menu"){drawer=true;render()}
 else if(a==="back"){openId=null;render()}
 else if(a==="clear"){q="";render()}
 else if(a==="unread"){P.unreadOnly=!P.unreadOnly;save();render()}
 else if(a==="refresh"){spin=true;fetchSim()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;render()}});
fetchSim();
</script>
</body>
</html>
